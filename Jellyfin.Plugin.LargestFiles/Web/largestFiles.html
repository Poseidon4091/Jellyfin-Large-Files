<!DOCTYPE html>
<html>
<head>
    <title>Largest Files</title>
</head>
<body>
<div id="LargestFilesPage" data-role="page" class="page type-interior pluginConfigurationPage" data-controller="__plugin/largestFiles">
    <div data-role="content">
        <div class="content-primary">
            <h1>Largest Files</h1>
            <p>Top items per library, sorted by on-disk size, largest first.</p>

            <div style="display:flex; gap:1em; align-items:center; margin-bottom:1em; flex-wrap:wrap;">
                <label>
                    Library:
                    <select is="emby-select" id="libraryId" style="min-width:12em;">
                        <option value="">All libraries</option>
                    </select>
                </label>
                <label>
                    Limit:
                    <input is="emby-input" type="number" id="limit" value="100" style="width:6em;" />
                </label>
                <button is="emby-button" type="button" class="raised button-submit" id="refreshBtn">Refresh</button>
                <button is="emby-button" type="button" class="raised" id="exportAllBtn">Export All to CSV</button>
            </div>

            <div id="statusMessage" style="color:#ff6161; margin-bottom:1em; display:none;"></div>

            <div id="groupsContainer"></div>
        </div>
    </div>

    <script type="text/javascript">
        (function () {
            function formatSize(bytes) {
                var units = ['B', 'KB', 'MB', 'GB', 'TB'];
                var i = 0;
                var val = bytes;
                while (val >= 1024 && i < units.length - 1) {
                    val /= 1024;
                    i++;
                }
                return val.toFixed(2) + ' ' + units[i];
            }

            function escapeHtml(s) {
                return (s || '').replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function currentParams(page) {
                var params = {
                    perCategoryLimit: page.querySelector('#limit').value || 100
                };
                var libraryId = page.querySelector('#libraryId').value;
                if (libraryId) {
                    params.libraryId = libraryId;
                }
                return params;
            }

            function showStatus(page, message) {
                var el = page.querySelector('#statusMessage');
                if (!message) {
                    el.style.display = 'none';
                    el.textContent = '';
                    return;
                }
                el.style.display = 'block';
                el.textContent = message;
            }

            function loadLibraries(page) {
                return ApiClient.getJSON(ApiClient.getUrl('LargestFiles/Libraries')).then(function (libraries) {
                    showStatus(page, null);
                    var select = page.querySelector('#libraryId');
                    if (!libraries.length) {
                        showStatus(page, 'No libraries were returned by the server - check Jellyfin has at least one media library configured.');
                    }
                    libraries.forEach(function (lib) {
                        var option = document.createElement('option');
                        option.value = lib.Id;
                        option.textContent = lib.Name;
                        select.appendChild(option);
                    });
                }).catch(function (err) {
                    var detail = (err && err.message) ? err.message : String(err);
                    showStatus(page, 'Failed to load libraries: ' + detail);
                });
            }

            function renderGroup(group) {
                var section = document.createElement('div');
                section.style.marginBottom = '2em';

                var heading = document.createElement('h2');
                heading.textContent = group.Category + ' (' + group.Items.length + ')';
                section.appendChild(heading);

                var exportBtn = document.createElement('button');
                exportBtn.setAttribute('is', 'emby-button');
                exportBtn.className = 'raised';
                exportBtn.style.marginBottom = '0.5em';
                exportBtn.textContent = 'Export ' + group.Category + ' to CSV';
                exportBtn.addEventListener('click', function () {
                    exportGroupCsv(group);
                });
                section.appendChild(exportBtn);

                var table = document.createElement('table');
                table.className = 'detailTable';
                table.style.width = '100%';
                table.innerHTML =
                    '<thead><tr>' +
                    '<th class="detailTableHeaderCell">Size</th>' +
                    '<th class="detailTableHeaderCell">Name</th>' +
                    '<th class="detailTableHeaderCell">Type</th>' +
                    '<th class="detailTableHeaderCell">Files</th>' +
                    '<th class="detailTableHeaderCell">Path</th>' +
                    '</tr></thead>';

                var tbody = document.createElement('tbody');
                group.Items.forEach(function (item) {
                    var row = document.createElement('tr');
                    row.innerHTML =
                        '<td class="detailTableBodyCell">' + formatSize(item.SizeBytes) + '</td>' +
                        '<td class="detailTableBodyCell">' + escapeHtml(item.Name) + '</td>' +
                        '<td class="detailTableBodyCell">' + escapeHtml(item.Type) + '</td>' +
                        '<td class="detailTableBodyCell">' + item.FileCount + '</td>' +
                        '<td class="detailTableBodyCell" style="word-break:break-all;">' + escapeHtml(item.Path) + '</td>';
                    tbody.appendChild(row);
                });
                table.appendChild(tbody);
                section.appendChild(table);

                return section;
            }

            function csvEscape(value) {
                value = value == null ? '' : String(value);
                if (value.indexOf(',') !== -1 || value.indexOf('"') !== -1 || value.indexOf('\n') !== -1) {
                    return '"' + value.replace(/"/g, '""') + '"';
                }
                return value;
            }

            function saveBlob(blob, filename) {
                if (window.showSaveFilePicker) {
                    return window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{ description: 'CSV file', accept: { 'text/csv': ['.csv'] } }]
                    }).then(function (handle) {
                        return handle.createWritable();
                    }).then(function (writable) {
                        return writable.write(blob).then(function () { return writable.close(); });
                    }).catch(function (err) {
                        if (err && err.name === 'AbortError') {
                            return;
                        }
                        downloadFallback(blob, filename);
                    });
                }

                downloadFallback(blob, filename);
                return Promise.resolve();
            }

            function downloadFallback(blob, filename) {
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function rowsToCsvBlob(rows) {
                var csv = rows.map(function (r) { return r.map(csvEscape).join(','); }).join('\n');
                return new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            }

            function exportGroupCsv(group) {
                var rows = [['Category', 'Name', 'Type', 'FileCount', 'SizeBytes', 'SizeMB', 'Path']];
                group.Items.forEach(function (item) {
                    rows.push([
                        group.Category,
                        item.Name,
                        item.Type,
                        item.FileCount,
                        item.SizeBytes,
                        (item.SizeBytes / 1024 / 1024).toFixed(2),
                        item.Path
                    ]);
                });
                saveBlob(rowsToCsvBlob(rows), group.Category.replace(/[^a-z0-9]+/gi, '_') + '-largest-files.csv');
            }

            function load(page) {
                var params = currentParams(page);
                var container = page.querySelector('#groupsContainer');
                container.textContent = 'Loading...';
                ApiClient.getJSON(ApiClient.getUrl('LargestFiles', params))
                    .then(function (groups) {
                        page.currentGroups = groups;
                        container.innerHTML = '';
                        if (!groups.length) {
                            container.textContent = 'No items found.';
                            return;
                        }
                        groups.forEach(function (group) {
                            container.appendChild(renderGroup(group));
                        });
                    })
                    .catch(function (err) {
                        var detail = (err && err.message) ? err.message : String(err);
                        container.textContent = '';
                        showStatus(page, 'Failed to load data: ' + detail);
                    });
            }

            document.getElementById('LargestFilesPage').addEventListener('pageshow', function () {
                var page = this;

                if (!page.librariesLoaded) {
                    page.librariesLoaded = true;
                    loadLibraries(page).then(function () {
                        load(page);
                    });
                } else {
                    load(page);
                }

                page.querySelector('#libraryId').addEventListener('change', function () {
                    load(page);
                });

                page.querySelector('#refreshBtn').addEventListener('click', function () {
                    load(page);
                });

                page.querySelector('#exportAllBtn').addEventListener('click', function () {
                    var params = currentParams(page);
                    var url = ApiClient.getUrl('LargestFiles/Csv', params);
                    fetch(url, { headers: { 'X-Emby-Token': ApiClient.accessToken() } })
                        .then(function (response) { return response.blob(); })
                        .then(function (blob) { return saveBlob(blob, 'largest-files.csv'); });
                });
            });
        })();
    </script>
</div>
</body>
</html>
